name: CI

    on:
      push:
        branches: [main]
      pull_request:
      workflow_dispatch:

    permissions:
      contents: read

    jobs:
      test:
        runs-on: windows-latest
        strategy:
          fail-fast: false
          matrix:
            node: ['20', '22']
            python: ['3.10', '3.12']
        steps:
          - uses: actions/checkout@v4

          - uses: actions/setup-node@v4
            with:
              node-version: ${{ matrix.node }}

          - uses: actions/setup-python@v5
            with:
              python-version: ${{ matrix.python }}

          - name: Syntax check
            run: npm run check

          - name: Smoke test
            run: npm test
    